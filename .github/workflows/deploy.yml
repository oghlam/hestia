name: Build & Deploy HESTIA

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: "18"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run linter (TypeScript)
        run: npm run build
        continue-on-error: true

      - name: Run tests
        run: npm test
        continue-on-error: true

  deploy:
    name: Deploy to EC2
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_DEPLOY_KEY }}

      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH
        run: |
          set -e
          
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          EC2_USER="${{ secrets.EC2_USER }}"
          EC2_HOST="${{ secrets.EC2_HOST }}"
          
          echo "=== HESTIA Deployment Started ==="
          echo "Target: $EC2_USER@$EC2_HOST:$DEPLOY_PATH"
          
          ssh -v $EC2_USER@$EC2_HOST << 'DEPLOY_SCRIPT'
            set -e
            
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            
            echo "=== Setting up deployment ==="
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            
            echo "=== Cloning/Pulling latest code ==="
            if [ -d .git ]; then
              echo "Repository exists, pulling latest changes..."
              git fetch origin main
              git reset --hard origin/main
              git clean -fd
            else
              echo "Cloning repository..."
              # Remove directory first if it exists but is not a git repo
              if [ -d . ] && [ ! -z "$(ls -A .)" ]; then
                echo "Directory exists with content, backing up..."
                mv "$DEPLOY_PATH" "$DEPLOY_PATH.backup.$(date +%s)"
                mkdir -p "$DEPLOY_PATH"
                cd "$DEPLOY_PATH"
              fi
              git clone --branch main https://github.com/oghlam/hestia.git .
            fi
            
            echo "=== Installing dependencies ==="
            npm install --production=false
            
            echo "=== Building application ==="
            npm run build
            
            echo "=== Checking environment configuration ==="
            if [ ! -f .env ]; then
              echo "⚠️  No .env file found. Using template..."
              if [ -f .env.template ]; then
                cp .env.template .env
                echo "⚠️  WARNING: Using template values. Please update .env with real credentials!"
              fi
            fi
            
            echo "=== Restarting application ==="
            pm2 stop hestia || true
            pm2 delete hestia || true
            sleep 2
            
            PORT=8787 NODE_ENV=production pm2 start npm --name "hestia" -- run api
            pm2 save
            
            echo "=== Deployment Completed Successfully ==="
            echo "Application running on port 8787"
            sleep 3
            
            echo "=== Verifying application status ==="
            pm2 status
          DEPLOY_SCRIPT
          
          echo ""
          echo "✅ Deployment successful!"

      - name: Verify Deployment
        run: |
          echo "Testing HTTPS endpoint..."
          curl -k -s https://${{ secrets.EC2_HOST }} | head -1 || echo "⚠️  Application may still be starting up"
